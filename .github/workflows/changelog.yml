name: changelog

# Every pull request must add its entries to CHANGELOG.md, unless labelled "skip-changelog".
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md updated
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --name-only "$BASE...$HEAD" | grep -qx CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Add this pull request's changes under 'Unreleased' in CHANGELOG.md (or label it skip-changelog)."
            exit 1
          fi
          if ! git diff "$BASE...$HEAD" -- CHANGELOG.md | grep -q "^+.*(\[#${{ github.event.pull_request.number }}\])"; then
            echo "::error file=CHANGELOG.md::Changelog entries must end with ([#${{ github.event.pull_request.number }}])."
            exit 1
          fi
