name: release

# Push a tag like v0.3.0 to build the app for every OS, publish a GitHub release and publish the
# package to PyPI. Run manually (workflow_dispatch) to only build and download the artifacts, and
# optionally publish the package to TestPyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish the package to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag, pyproject.toml and __version__ agree
        run: |
          project=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          module=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/python_manager/__init__.py').read()).group(1))")
          echo "pyproject.toml: $project, __version__: $module"
          if [ "$project" != "$module" ]; then
            echo "::error::pyproject.toml ($project) and __version__ ($module) differ"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$project" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $project"
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: python-manager-windows-x64.zip
          - os: macos-latest
            asset: python-manager-macos-arm64.zip
          - os: macos-15-intel
            asset: python-manager-macos-x64.zip
          - os: ubuntu-22.04
            asset: python-manager-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . "pyinstaller>=6"
      - name: Licence texts
        run: |
          mkdir build-licenses
          cp packaging/licenses/* build-licenses/
          cp LICENSE build-licenses/LICENSE.txt
          python -m pip list --format=freeze > build-licenses/bundled-packages.txt
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name "Python Manager"
          --add-data "build-licenses:licenses"
          --collect-submodules python_manager src/python_manager/__main__.py
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Smoke test the build
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "$RUNNER_OS" in
            macOS) exe="dist/Python Manager.app/Contents/MacOS/Python Manager"
                   licenses="dist/Python Manager.app/Contents/Resources/licenses" ;;
            Windows) exe="dist/Python Manager/Python Manager.exe"
                     licenses="dist/Python Manager/_internal/licenses" ;;
            *) exe="dist/Python Manager/Python Manager"
               licenses="dist/Python Manager/_internal/licenses" ;;
          esac
          for f in LICENSE.txt LGPL-3.0-only.txt GPL-3.0-only.txt THIRD-PARTY-NOTICES.txt bundled-packages.txt; do
            test -s "$licenses/$f" || { echo "::error::$f missing from the build"; exit 1; }
          done
          "$exe" --self-test
      - name: Licence texts next to the executable
        if: runner.os != 'macOS'
        run: cp -r build-licenses "dist/Python Manager/licenses"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cd dist && 7z a -tzip "../${{ matrix.asset }}" "Python Manager"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Python Manager.app" "${{ matrix.asset }}"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist "Python Manager"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ || /^\[[^]]+\]: / {f=0} f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::No '## [$version]' section in CHANGELOG.md"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body_path: notes.md

  dist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  # Trusted publishing: add this repository, workflow "release.yml" and environment "pypi" as a
  # publisher of the project on pypi.org (and environment "testpypi" on test.pypi.org).
  pypi:
    needs: [dist, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/python-manager-gui/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    needs: dist
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/python-manager-gui/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
