name: release

# Push a tag like v0.2.0 to build the app for every OS and publish a GitHub release.
# Run manually (workflow_dispatch) to only build and download the artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: python-manager-windows-x64.zip
          - os: macos-latest
            asset: python-manager-macos-arm64.zip
          - os: macos-15-intel
            asset: python-manager-macos-x64.zip
          - os: ubuntu-22.04
            asset: python-manager-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name "Python Manager"
          --collect-submodules python_manager src/python_manager/__main__.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cd dist && 7z a -tzip "../${{ matrix.asset }}" "Python Manager"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Python Manager.app" "${{ matrix.asset }}"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist "Python Manager"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ || /^\[[^]]+\]: / {f=0} f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::No '## [$version]' section in CHANGELOG.md"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body_path: notes.md
