[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "python-manager"
version = "0.2.0"
description = "Desktop app to install Python versions, manage packages and virtual environments."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PySide6>=6.5", "packaging>=21"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
python-manager-cli = "python_manager.cli:main"

[project.gui-scripts]
python-manager = "python_manager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
