[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-manager-gui"
version = "0.3.0"
description = "Desktop app to install Python versions, manage packages and virtual environments."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Faheem Khaskheli" }]
keywords = ["python", "virtualenv", "venv", "pip", "uv", "package-manager", "pyside6", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
]
dependencies = ["PySide6-Essentials>=6.5", "packaging>=21"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/faheemkhaskheli9/python-manager"
Source = "https://github.com/faheemkhaskheli9/python-manager"
Issues = "https://github.com/faheemkhaskheli9/python-manager/issues"
Changelog = "https://github.com/faheemkhaskheli9/python-manager/blob/main/CHANGELOG.md"
Releases = "https://github.com/faheemkhaskheli9/python-manager/releases"

[project.scripts]
python-manager-cli = "python_manager.cli:main"

[project.gui-scripts]
python-manager = "python_manager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
